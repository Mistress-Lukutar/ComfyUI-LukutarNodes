# NOTE: This pack is installed by cloning into ComfyUI/custom_nodes or via
# the ComfyUI registry (https://registry.comfy.org/publishers/mistress-lukutar),
# not via pip. The project/tool.comfy tables carry registry + package metadata;
# the tool sections below configure the development workflow.
[project]
# Registry node name — immutable after the first publish.
name = "lukutar-nodes"
version = "0.10.1"
description = "ComfyUI custom node pack: color matching, SEGS overlays, prompt annotation, workflow variables."
authors = [{ name = "Mistress-Lukutar" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    # torch and numpy are provided by the ComfyUI runtime.
    "opencv-python>=4.8",
]

[project.urls]
Repository = "https://github.com/Mistress-Lukutar/ComfyUI-LukutarNodes"

[tool.comfy]
PublisherId = "mistress-lukutar"
DisplayName = "Lukutar Nodes"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode keeps sys.path untouched: the ComfyUI-mandated root
# __init__.py must never be importable as a plain "__init__" module.
addopts = "--import-mode=importlib"
consider_namespace_packages = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
